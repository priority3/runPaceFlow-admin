services:
  runpaceflow-admin:
    build: .
    container_name: runpaceflow-admin
    restart: unless-stopped
    # host 网络:admin 通过 127.0.0.1:3000 探测主站;也用 127.0.0.1:6006 发 trace 给 Phoenix
    network_mode: host
    depends_on:
      - phoenix
    env_file:
      - .env
    environment:
      - PORT=3030
      - NODE_ENV=production
      - RUNPACEFLOW_FRONTEND_URL=http://127.0.0.1:3000
      - DATABASE_URL=file:/app/data/admin.db
      - ACTIVITIES_DATABASE_URL=file:/app/shared/shared.db
      # 可观测:配了就把 agent trace 发到 Phoenix;留空则 tracing 关闭(no-op,零开销)。
      - PHOENIX_COLLECTOR_ENDPOINT=http://127.0.0.1:6006
      - PHOENIX_PROJECT_NAME=pr-agent
      # Phoenix 开鉴权后,OTLP 摄取需带 key —— 用 phoenix 的 PHOENIX_ADMIN_SECRET 作系统 key
      - PHOENIX_API_KEY=change-me-same-as-phoenix-admin-secret
    volumes:
      - runpaceflow-admin-data:/app/data
      - rpf_shared_data:/app/shared

  # Arize Phoenix:agent trace 可视化(瀑布图 / 会话视图 / token 统计)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    # 只绑本机回环:app(host 网络)经 127.0.0.1:6006 发 trace + 查询。
    # 公网访问用独立子域 phoenix.razet.me(经 cloudflared 隧道)+ 下面的自带登录鉴权。
    ports:
      - '127.0.0.1:6006:6006'
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # 自带鉴权(SECRET/ADMIN_SECRET 需 ≥32 且互不相同;ADMIN_SECRET 兼作系统 API key)
      - PHOENIX_ENABLE_AUTH=true
      - PHOENIX_SECRET=change-me-32+chars-random
      - PHOENIX_ADMIN_SECRET=change-me-different-32+chars-random
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=change-me-initial-login
    volumes:
      - phoenix_data:/mnt/data

volumes:
  runpaceflow-admin-data:
  rpf_shared_data:
    external: true
  phoenix_data:
