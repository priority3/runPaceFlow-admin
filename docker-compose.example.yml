services:
  runpaceflow-admin:
    build: .
    container_name: runpaceflow-admin
    restart: unless-stopped
    # host 网络:admin 通过 127.0.0.1:3000 探测主站;也用 127.0.0.1:6006 发 trace 给 Phoenix
    network_mode: host
    depends_on:
      - phoenix
    env_file:
      - .env
    environment:
      - PORT=3030
      - NODE_ENV=production
      - RUNPACEFLOW_FRONTEND_URL=http://127.0.0.1:3000
      - DATABASE_URL=file:/app/data/admin.db
      - ACTIVITIES_DATABASE_URL=file:/app/shared/shared.db
      # 可观测:配了就把 agent trace 发到 Phoenix;留空则 tracing 关闭(no-op,零开销)。
      # Phoenix 以 root_path=/phoenix 运行,OTLP 摄取也在该前缀下,故 endpoint 带 /phoenix。
      - PHOENIX_COLLECTOR_ENDPOINT=http://127.0.0.1:6006/phoenix
      - PHOENIX_PROJECT_NAME=pr-agent
    volumes:
      - runpaceflow-admin-data:/app/data
      - rpf_shared_data:/app/shared

  # Arize Phoenix:agent trace 可视化(瀑布图 / 会话视图 / token 统计)
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    # 只绑本机回环:trace 含健康数据,不裸暴露。公网访问经 admin 的 /phoenix 路由
    # (需 admin 登录态)反代进来;Phoenix 自身零鉴权,只对回环开放。
    ports:
      - '127.0.0.1:6006:6006'
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # 挂在 admin 的 /phoenix 子路径下:整个 SPA + 接口都带此前缀,资源才能正确解析
      - PHOENIX_HOST_ROOT_PATH=/phoenix
    volumes:
      - phoenix_data:/mnt/data

volumes:
  runpaceflow-admin-data:
  rpf_shared_data:
    external: true
  phoenix_data:
