name: deploy

# main 有推送 → 自动部署到服务器。
#
# 机制:rsync 源码到服务器,在服务器上 `docker compose build`(依赖走国内 npm 镜像),再重启容器。
#
# 为什么不在 GitHub 上构建再把镜像送过去(2026-09-28 改,先后试过两种都放弃了):
# 服务器在上海,GitHub(境外)↔ 服务器这条跨境链路白天严重拥塞 —— 09-28 实测:
#   GHCR 拉取:镜像层 307 到 pkg-containers.githubusercontent.com,40 KB/s
#   ssh 直传 docker save:14~31 KB/s,126 MB 的镜像要一两个小时
# pr-agent 同样的 ssh 直传只在北京时间凌晨 3 点左右快(23 秒),白天一次挂了 3 小时。
# 两种方式走的是同一条跨境链路,换传输方式没用。
#
# 在服务器上构建,大流量就全留在国内了:基础镜像经 daemon.json 里的 Docker Hub 镜像源拉取,
# npm 依赖经 NPM_MIRROR 走 npmmirror(实测 437 个包 17 秒,官方源同一时段 777 秒)。
# 跨境的只剩 rsync 的源码增量,体量很小。
#
# 为什么用 rsync 而不是在服务器上 git pull:服务器 /opt/runPaceFlow-admin 的 git index
# 已损坏(fatal: index file smaller than expected),且那边也不该持有 GitHub 凭据。
on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动重新部署(回滚后重放等)

concurrency:
  group: deploy-runpaceflow-admin
  cancel-in-progress: false # 部署不可中断:半路取消会留下构建到一半的镜像

jobs:
  # 先复用 checks:构建不过的东西不该上线。
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 末尾换行不能少:OpenSSH 私钥缺 trailing newline 会报 error in libcrypto
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步源码
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # 服务器上的构建以这份源码为准。--delete 清掉仓库已删除的文件。排除项是
        # 「服务器独有、仓库不该覆盖」的:
        #   .env / docker-compose.yml —— 密钥与本地拓扑(外部卷、host 网络、构建参数)
        #   data/ —— admin.db 与上传目录
        #   .git —— 那边的 index 已损坏,别动它
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -p $PORT -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'docker-compose.yml' \
            --exclude 'data' \
            --exclude 'node_modules' \
            --exclude '.next' \
            ./ "$USER@$HOST:/opt/runPaceFlow-admin/"

      - name: 服务器上构建镜像
        # 正常约 3~5 分钟(依赖 17 秒,其余是 next build)。硬上限防止卡住时挂满 6 小时。
        timeout-minutes: 30
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # set -o pipefail 不能少:此前 `... 2>&1 | tail -20` 让 shell 取了 tail 的退出码,
        # 构建失败照样是绿的 —— PrAccessCard 就那样静默漏上线过一次。
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=30 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/runPaceFlow-admin
          # Reason: 服务器 compose 不在仓库里。若它没有 build 配置,compose build 会静默跳过
          # 该服务,随后 up -d 继续跑旧镜像 —— 部署全绿、线上没变。这里先把它拦下来。
          docker compose config --format json | python3 -c '
          import json, sys
          svc = json.load(sys.stdin)["services"]["runpaceflow-admin"]
          if "build" not in svc:
              sys.exit("::error::服务器 docker-compose.yml 的 runpaceflow-admin 缺少 build 配置,拒绝部署")
          if "NPM_MIRROR" not in (svc["build"].get("args") or {}):
              print("::warning::未配置 NPM_MIRROR,依赖将走官方源(实测慢 40 倍以上)")
          '
          docker compose build runpaceflow-admin 2>&1 | tail -30
          REMOTE

      - name: 启动
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # compose 比较镜像 ID,新构建的与运行中的不同就重建容器。
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/runPaceFlow-admin
          docker compose up -d runpaceflow-admin
          docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true
          REMOTE

      - name: 部署后探活
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf http://127.0.0.1:3030/api/health > /dev/null; then
              echo "health OK"
              exit 0
            fi
          done
          echo "90s 内未就绪,最后 30 行日志:"
          docker logs --tail 30 runpaceflow-admin
          exit 1
          REMOTE
