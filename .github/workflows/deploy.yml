name: deploy

# main 有推送 → 自动部署到服务器。
#
# 机制:GitHub runner 构建镜像,经 ssh 管道直传到服务器 `docker load`,再重启容器。
# 不经过任何 registry。与 pr-agent 仓的部署方式一致(那边 09-07 起就这么跑)。
#
# 为什么不用 GHCR(2026-09-28 改):服务器在上海,拉 GHCR 镜像分两段 ——
#   ghcr.io 本身(认证 + manifest)  实测 0.59s / HTTP 200,是好的
#   镜像层 → 307 跳到 pkg-containers.githubusercontent.com  实测 40 KB/s,30 秒下不完 3.6 MB
# docker pull 又没有超时,于是 CI 就一直挂在「拉取镜像」那步不动。南大镜像站同一层是
# 13 MB/s,但本仓镜像是私有的,走它等于把 GitHub token 交给第三方,不采用。
#
# 为什么不在服务器上现场构建:bun install 几百个包并发下载时好时坏,且一次要 7 分钟。
#
# 为什么仍然 rsync:服务器的 docker-compose.yml 引用了仓库里的辅助文件,源码在手边
# 也便于排查。它不再是构建来源。
on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动重新部署(回滚后重放等)

concurrency:
  group: deploy-runpaceflow-admin
  cancel-in-progress: false # 部署不可中断:半路取消会留下传到一半的镜像

env:
  # 本地 tag(不进任何 registry);服务器 compose 用同名引用 + pull_policy: never,
  # 保证 compose 永远不会自作主张去拉取(一拉就又卡死)。
  IMAGE: runpaceflow-admin:latest

jobs:
  # 先复用 checks:构建不过的东西不该上线。
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # 装进 runner 本地 daemon,下一步 docker save 导出
          tags: ${{ env.IMAGE }}
          # GitHub Actions 缓存:未变的层不重建。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 准备 SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # 末尾换行不能少:OpenSSH 私钥缺 trailing newline 会报 error in libcrypto
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步源码
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # --delete 清掉服务器上已从仓库删除的文件。排除项是「服务器独有、仓库不该覆盖」的:
        #   .env / docker-compose.yml —— 密钥与本地拓扑(外部卷、host 网络、phoenix 依赖)
        #   data/ —— admin.db 与上传目录
        #   .git —— 那边的 index 已损坏,别动它
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -p $PORT -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'docker-compose.yml' \
            --exclude 'data' \
            --exclude 'node_modules' \
            --exclude '.next' \
            ./ "$USER@$HOST:/opt/runPaceFlow-admin/"

      - name: 传输镜像到服务器
        # 硬上限:3 次 × 10 分钟 + 余量。不设的话 job 默认能挂 6 小时。
        timeout-minutes: 35
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # 镜像经 ssh 管道直传,不落盘、不经过任何 registry。
        #
        # Reason: 这条链路通常很快,但会偶发卡死 —— pr-agent 同样的传输两次各 23 秒,
        # 中间一次却挂了整整 3 小时(09-09 12:28 → 15:28)。所以单次限时,卡住就杀掉重连:
        # 新的 TCP 连接往往能拿到正常速度。
        #   单次 600s:本仓 gzip 后约 126 MB,正常约 25 秒;即使按见过的最慢「仍在动」的
        #              0.4 MB/s 也只要 5 分钟。超过 10 分钟就当它卡死了。
        #   ServerAlive:15 秒一次心跳、连丢 4 次断开,死连接一分钟内就能发现,
        #              不必等满 10 分钟。
        #   docker load 读到截断的流会报 unexpected EOF 且不打 tag,重试是安全的。
        #
        # gzip -1:docker save 导出的是未压缩层,瓶颈在带宽不在 CPU,-1 与 -9 的体积差
        # 远小于耗时差。
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy -p $PORT -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            echo "第 $attempt 次传输…"
            if timeout 600 bash -o pipefail -c \
                 "docker save '$IMAGE' | gzip -1 | $SSH '$USER@$HOST' 'gunzip | docker load'"; then
              echo "传输成功(第 $attempt 次)"
              exit 0
            fi
            echo "::warning::第 $attempt 次传输失败或超时(>600s),重连重试"
          done
          echo "::error::3 次传输都没成功"
          exit 1

      - name: 启动
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        # compose 会比较镜像 ID,load 进来的新镜像与运行中的不同就重建容器。
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/runPaceFlow-admin
          docker compose up -d runpaceflow-admin
          docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true
          REMOTE

      - name: 部署后探活
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf http://127.0.0.1:3030/api/health > /dev/null; then
              echo "health OK"
              exit 0
            fi
          done
          echo "90s 内未就绪,最后 30 行日志:"
          docker logs --tail 30 runpaceflow-admin
          exit 1
          REMOTE
